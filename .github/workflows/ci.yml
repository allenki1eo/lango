name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURSO_DATABASE_URL: file:ci.db
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Search ranking fixture
        run: pnpm test:search

      - name: Migrations are up to date
        run: |
          pnpm db:generate
          git diff --exit-code -- drizzle || (echo "Schema changed without a migration. Run pnpm db:generate." && exit 1)

      - name: Migrate and seed (twice, to prove the seed is idempotent)
        run: |
          pnpm db:migrate
          pnpm db:seed
          pnpm db:seed

      - name: Build
        run: pnpm build

      - name: JavaScript budget
        run: pnpm check:budget

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
